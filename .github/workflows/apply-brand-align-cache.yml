name: Apply brand alignment cache refresh

on:
  push:
    paths:
      - '.github/workflows/apply-brand-align-cache.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh brand alignment loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('config.js')
          s=p.read_text(encoding='utf-8')
          old="v043_logo_fix.js?v=043-logo-direct-final-20260830"
          new="v043_logo_fix.js?v=043-brand-align-20260830-1705"
          if old not in s and new not in s:
              raise SystemExit('logo fix loader not found')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          node --check config.js
          node --check v043_logo_fix.js
      - name: Commit loader refresh
        run: |
          git config user.name 'facility-ops-ui-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add config.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Load v0.4.3 brand alignment patch'
          git push
