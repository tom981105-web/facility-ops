name: Apply v0.4.3 security final

on:
  push:
    paths:
      - '.github/workflows/apply-v043-security-final.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch bootstrap and strict admin checks
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  print(label, 'already applied')
                  return
              if old not in text:
                  raise SystemExit(f'{label}: expected source not found')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
              print(label, 'applied')

          replace_once(
              'config.js',
              """  function isAdminUi() {\n    return document.querySelector('#userChip small')?.textContent?.trim() === '관리자';\n  }""",
              """  function isAdminUi() {\n    try {\n      return currentProfile?.role === 'admin'\n        && currentProfile?.approved !== false\n        && (!currentProfile?.account_status || currentProfile.account_status === 'active');\n    } catch (_) { return false; }\n  }""",
              'config strict admin'
          )

          replace_once(
              'config.js',
              """      security.id = 'facilityOpsV041Script';\n      security.src = 'v041.js?v=042-stable-core';\n      security.async = false;\n      document.body.appendChild(security);""",
              """      security.id = 'facilityOpsV041Script';\n      security.src = 'v041.js?v=043-final-core';\n      security.async = false;\n      security.onload = function() {\n        if (document.getElementById('facilityOpsV043Script')) return;\n        const finalSecurity = document.createElement('script');\n        finalSecurity.id = 'facilityOpsV043Script';\n        finalSecurity.src = 'v043.js?v=043-final-20260830';\n        finalSecurity.async = false;\n        document.body.appendChild(finalSecurity);\n      };\n      document.body.appendChild(security);""",
              'v043 loader'
          )

          replace_once(
              'v04.js',
              """  function isAdmin() {\n    try { if (currentProfile?.role === 'admin') return true; } catch (_) {}\n    return document.querySelector('#userChip small')?.textContent?.trim() === '관리자';\n  }""",
              """  function isAdmin() {\n    try {\n      return currentProfile?.role === 'admin'\n        && currentProfile?.approved !== false\n        && (!currentProfile?.account_status || currentProfile.account_status === 'active');\n    } catch (_) { return false; }\n  }""",
              'v04 strict admin'
          )

          replace_once(
              'v041.js',
              """  function isAdmin() {\n    try { return currentProfile?.role === 'admin' && currentProfile?.approved !== false; }\n    catch (_) { return document.querySelector('#userChip small')?.textContent?.trim() === '관리자'; }\n  }""",
              """  function isAdmin() {\n    try {\n      return currentProfile?.role === 'admin'\n        && currentProfile?.approved !== false\n        && (!currentProfile?.account_status || currentProfile.account_status === 'active');\n    } catch (_) { return false; }\n  }""",
              'v041 strict admin'
          )

          replace_once(
              'v042.js',
              "function isAdminProfile(p){return p?.approved!==false&&p?.role==='admin';}",
              "function isAdminProfile(p){return p?.approved!==false&&p?.role==='admin'&&(!p?.account_status||p.account_status==='active');}",
              'v042 strict admin helper'
          )

          replace_once(
              'v042.js',
              "const admin=document.querySelector('#userChip small')?.textContent?.trim()==='관리자';btn.hidden=!admin;btn.style.display=admin?'':'none';",
              "const admin=isAdminProfile(lastProfile);btn.hidden=!admin;btn.style.display=admin?'':'none';",
              'v042 security button role'
          )

          replace_once(
              'v042.js',
              "if(document.querySelector('#userChip small')?.textContent?.trim()!=='관리자')return;",
              "if(!isAdminProfile(lastProfile))return;",
              'v042 security test role'
          )

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace('<title>FACILITY OPS v0.4.2 - Security Hardening</title>', '<title>FACILITY OPS</title>')
          text = text.replace('config.js?v=042-stable-20260830', 'config.js?v=043-final-20260830')
          p.write_text(text, encoding='utf-8')

      - name: Validate JavaScript syntax
        run: |
          node --check config.js
          node --check v04.js
          node --check v041.js
          node --check v042.js
          node --check v043.js

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No changes required'
            exit 0
          fi
          git config user.name 'facility-ops-security-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add config.js index.html v04.js v041.js v042.js
          git commit -m 'Activate v0.4.3 final security hardening'
          git push
