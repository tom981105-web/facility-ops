name: One-time v0.4.2 login init fix

on:
  push:
    paths:
      - '.github/workflows/one-time-v042-login-init-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-login:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch login initialization
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""async function loginWithPassword(email,password){
  document.getElementById('loginError').textContent='';
  try{setOnlineStatus('로그인 중',false);const {data,error}=await dbClient.auth.signInWithPassword({email,password});if(error)throw error;currentUser=data.user;document.getElementById('authGate').hidden=true;await loadRemoteData();startRealtime();}
  catch(err){document.getElementById('loginError').textContent=err.message||'로그인에 실패했습니다.';setOnlineStatus('로그인 필요',false);}
}"""
          new="""async function loginWithPassword(email,password){
  const errorEl=document.getElementById('loginError');
  if(errorEl)errorEl.textContent='';
  try{
    setOnlineStatus('로그인 중',false);
    if(!dbClient){
      const cfg=getRuntimeConfig();
      if(!cfg?.supabaseUrl||!cfg?.supabaseKey)throw new Error('서버 연결 정보를 불러오지 못했습니다. 새로고침 후 다시 시도해 주세요.');
      await initSupabase(cfg);
    }
    if(!dbClient?.auth)throw new Error('로그인 서버 초기화에 실패했습니다. 잠시 후 다시 시도해 주세요.');
    const raw=String(email||'').trim().toLowerCase();
    const actualEmail=raw.includes('@')?raw:raw+'@facility.local';
    const {data,error}=await dbClient.auth.signInWithPassword({email:actualEmail,password});
    if(error)throw error;
    currentUser=data.user;
    document.getElementById('authGate').hidden=true;
    await loadRemoteData();
    startRealtime();
  }catch(err){
    console.error('[FACILITY OPS login]',err);
    if(errorEl)errorEl.textContent=err?.message||'로그인에 실패했습니다.';
    setOnlineStatus('로그인 필요',false);
  }
}"""
          if old not in s:
              raise SystemExit('target login function not found')
          s=s.replace(old,new,1)
          s=s.replace('config.js?v=0422-20260830','config.js?v=0423-loginfix-20260830')
          p.write_text(s,encoding='utf-8')
      - name: Commit patched login
        run: |
          git config user.name "facility-ops-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix v0.4.2 login client initialization"
          git push

# trigger 2
