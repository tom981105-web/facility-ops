name: Apply v0.4.3 command center

on:
  push:
    paths:
      - '.github/workflows/apply-v043-command-center.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Activate logo fix and command center
        shell: python
        run: |
          from pathlib import Path
          p=Path('config.js')
          s=p.read_text(encoding='utf-8')
          old="""          ui.id = 'facilityOpsUi043Script';
          ui.src = 'v043_ui.js?v=043-ops-ui-20260830';
          ui.async = false;
          document.body.appendChild(ui);"""
          new="""          ui.id = 'facilityOpsUi043Script';
          ui.src = 'v043_ui.js?v=043-ops-ui-20260830b';
          ui.async = false;
          ui.onload = function() {
            if (!document.getElementById('facilityOpsLogoFix043')) {
              const logoFix = document.createElement('script');
              logoFix.id = 'facilityOpsLogoFix043';
              logoFix.src = 'v043_logo_fix.js?v=043-logo-fix-20260830';
              logoFix.async = false;
              document.body.appendChild(logoFix);
            }
            if (!document.getElementById('facilityOpsDashboard043')) {
              const dashboard = document.createElement('script');
              dashboard.id = 'facilityOpsDashboard043';
              dashboard.src = 'v043_dashboard.js?v=043-command-center-20260830';
              dashboard.async = false;
              document.body.appendChild(dashboard);
            }
          };
          document.body.appendChild(ui);"""
          if new not in s:
            if old not in s:
              raise SystemExit('UI loader source not found')
            s=s.replace(old,new,1)
            p.write_text(s,encoding='utf-8')
      - name: Validate JavaScript
        run: |
          node --check config.js
          node --check v04.js
          node --check v041.js
          node --check v042.js
          node --check v043.js
          node --check v043_ui.js
          node --check v043_logo_fix.js
          node --check v043_dashboard.js
      - name: Commit activation
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'facility-ops-ui-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add config.js
          git commit -m 'Activate v0.4.3 command center dashboard'
          git push
