name: Apply v0.4.3 command center

on:
  push:
    paths:
      - '.github/workflows/apply-v043-command-center.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Activate logo fix and command center
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('config.js')
          s = p.read_text(encoding='utf-8')

          if 'facilityOpsDashboard043' not in s:
              start = s.find("ui.id = 'facilityOpsUi043Script';")
              if start < 0:
                  raise SystemExit('UI loader block not found')
              match = re.search(r"(?P<indent>[ \t]*)ui\.async = false;\n(?P=indent)document\.body\.appendChild\(ui\);", s[start:])
              if not match:
                  raise SystemExit('UI append point not found')
              indent = match.group('indent')
              replacement = (
                  indent + "ui.async = false;\n" +
                  indent + "ui.onload = function() {\n" +
                  indent + "  if (!document.getElementById('facilityOpsLogoFix043')) {\n" +
                  indent + "    const logoFix = document.createElement('script');\n" +
                  indent + "    logoFix.id = 'facilityOpsLogoFix043';\n" +
                  indent + "    logoFix.src = 'v043_logo_fix.js?v=043-logo-fix-20260830';\n" +
                  indent + "    logoFix.async = false;\n" +
                  indent + "    document.body.appendChild(logoFix);\n" +
                  indent + "  }\n" +
                  indent + "  if (!document.getElementById('facilityOpsDashboard043')) {\n" +
                  indent + "    const dashboard = document.createElement('script');\n" +
                  indent + "    dashboard.id = 'facilityOpsDashboard043';\n" +
                  indent + "    dashboard.src = 'v043_dashboard.js?v=043-command-center-20260830';\n" +
                  indent + "    dashboard.async = false;\n" +
                  indent + "    document.body.appendChild(dashboard);\n" +
                  indent + "  }\n" +
                  indent + "};\n" +
                  indent + "document.body.appendChild(ui);"
              )
              abs_start = start + match.start()
              abs_end = start + match.end()
              s = s[:abs_start] + replacement + s[abs_end:]

          s = s.replace("v043_ui.js?v=043-ops-ui-20260830'", "v043_ui.js?v=043-ops-ui-20260830b'")
          p.write_text(s, encoding='utf-8')

      - name: Validate JavaScript
        run: |
          node --check config.js
          node --check v04.js
          node --check v041.js
          node --check v042.js
          node --check v043.js
          node --check v043_ui.js
          node --check v043_logo_fix.js
          node --check v043_dashboard.js

      - name: Verify activation
        run: |
          grep -q "facilityOpsLogoFix043" config.js
          grep -q "facilityOpsDashboard043" config.js

      - name: Commit activation
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'facility-ops-ui-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add config.js
          git commit -m 'Activate v0.4.3 command center dashboard'
          git push
