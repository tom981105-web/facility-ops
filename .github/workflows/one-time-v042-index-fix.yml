name: One-time v0.4.2 index fix

on:
  push:
    paths:
      - '.github/workflows/one-time-v042-index-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html for v0.4.2
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              '<title>FACILITY OPS v0.3.0 - Multi User Online</title>': '<title>FACILITY OPS v0.4.2 - Security Hardening</title>',
              '<div class="version">FACILITY OPS v0.3.0 ONLINE</div>': '<div class="version">FACILITY OPS v0.4.2 SECURITY HARDENING</div>',
              '<div><h2>FACILITY OPS</h2><p>v0.3.1 MULTI USER ONLINE</p></div>': '<div><h2>FACILITY OPS</h2><p>v0.4.2 SECURITY HARDENING</p></div>',
              '<div class="auth-field"><label>이메일</label><input id="loginEmail" type="email" autocomplete="username" required></div>': '<div class="auth-field"><label>아이디</label><input id="loginEmail" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="예: admin" required></div>',
              '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>': '<script data-facility-pinned-sdk="2.112.4" src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.js"></script>',
              '<script src="config.js"></script>': '<script src="config.js?v=0422-20260830"></script>',
          }
          for old, new in replacements.items():
              if old not in s:
                  print('WARN missing:', old[:90])
              s = s.replace(old, new)

          # 운영판 연결 설정은 HTML 단계에서도 보이지 않게 고정. 요소는 기존 JS 호환을 위해 유지.
          s = s.replace('<button class="auth-tab" type="button" data-auth-tab="setup">연결 설정</button>', '<button class="auth-tab" type="button" data-auth-tab="setup" hidden style="display:none">연결 설정</button>')
          s = s.replace('<div class="auth-pane" id="authPane-setup">', '<div class="auth-pane" id="authPane-setup" hidden style="display:none">')

          # noindex/referrer/CSP를 config.js 실행 전부터 적용.
          marker = '  <meta name="color-scheme" content="dark light" />\n'
          security = (
              '  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex" />\n'
              '  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex" />\n'
              '  <meta name="referrer" content="no-referrer" />\n'
              '  <meta http-equiv="Content-Security-Policy" content="default-src \'self\'; base-uri \'self\'; object-src \'none\'; form-action \'self\'; script-src \'self\' \'unsafe-inline\' https://cdn.jsdelivr.net https://challenges.cloudflare.com; style-src \'self\' \'unsafe-inline\'; img-src \'self\' data: blob: https:; font-src \'self\' data:; connect-src \'self\' https://rmkjiqzcxbxwbiwqjjcz.supabase.co wss://rmkjiqzcxbxwbiwqjjcz.supabase.co https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; worker-src \'self\' blob:; manifest-src \'self\'; upgrade-insecure-requests" />\n'
          )
          if 'name="robots"' not in s:
              s = s.replace(marker, marker + security)

          p.write_text(s, encoding='utf-8')
      - name: Commit patched index
        run: |
          git config user.name "facility-ops-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix v0.4.2 bootstrap and stale cache loading"
          git push
