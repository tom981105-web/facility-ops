name: Apply v043 full UI polish

on:
  push:
    paths:
      - '.github/workflows/apply-full-polish.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize full polish
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('v043_polish.js')
          s=p.read_text(encoding='utf-8').replace('.body.light .view:not(#view-dashboard) .data-table thead','body.light .view:not(#view-dashboard) .data-table thead')
          p.write_text(s,encoding='utf-8')
          c=Path('config.js').read_text(encoding='utf-8')
          assert "polish.id = 'facilityOpsPolish043'" in c
          assert "v043_polish.js?v=043-full-interface-polish-20260830" in c
          PY
          node --check config.js
          node --check v043_polish.js
          node --check v043_dashboard.js
          node --check v043_logo_fix.js
      - name: Commit final polish
        run: |
          git config user.name 'facility-ops-ui-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add v043_polish.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Finalize v0.4.3 full interface polish'
          git push
