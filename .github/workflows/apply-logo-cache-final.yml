name: Apply final logo cache bump

on:
  push:
    paths:
      - '.github/workflows/apply-logo-cache-final.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump logo loader cache
        shell: python
        run: |
          from pathlib import Path
          p=Path('config.js')
          s=p.read_text(encoding='utf-8')
          old="v043_logo_fix.js?v=043-logo-theme-hotfix-20260830b"
          new="v043_logo_fix.js?v=043-logo-final-20260830c"
          if old in s:
              s=s.replace(old,new)
          elif new not in s:
              raise SystemExit('logo loader string not found')
          p.write_text(s,encoding='utf-8')
      - name: Validate JS
        run: |
          node --check config.js
          node --check v043_logo_fix.js
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'facility-ops-ui-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add config.js
          git commit -m 'Use final FACILITY OPS logo mount'
          git push
