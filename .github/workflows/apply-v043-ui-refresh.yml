name: Apply v0.4.3 operations UI refresh

on:
  push:
    paths:
      - '.github/workflows/apply-v043-ui-refresh.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load UI after security core
        shell: python
        run: |
          from pathlib import Path
          p = Path('config.js')
          s = p.read_text(encoding='utf-8')
          old = "        finalSecurity.id = 'facilityOpsV043Script';\n        finalSecurity.src = 'v043.js?v=043-final-20260830';\n        finalSecurity.async = false;\n        document.body.appendChild(finalSecurity);"
          new = "        finalSecurity.id = 'facilityOpsV043Script';\n        finalSecurity.src = 'v043.js?v=043-final-20260830';\n        finalSecurity.async = false;\n        finalSecurity.onload = function() {\n          if (document.getElementById('facilityOpsUi043Script')) return;\n          const ui = document.createElement('script');\n          ui.id = 'facilityOpsUi043Script';\n          ui.src = 'v043_ui.js?v=043-ops-ui-20260830';\n          ui.async = false;\n          document.body.appendChild(ui);\n        };\n        document.body.appendChild(finalSecurity);"
          if new not in s:
              if old not in s:
                  raise SystemExit('expected v043 loader not found')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Validate JavaScript
        run: |
          node --check config.js
          node --check v04.js
          node --check v041.js
          node --check v042.js
          node --check v043.js
          node --check v043_ui.js
      - name: Commit UI activation
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'facility-ops-ui-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add config.js
          git commit -m 'Activate v0.4.3 operations dashboard UI'
          git push
