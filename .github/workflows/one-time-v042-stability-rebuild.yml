name: One-time v0.4.2 stability rebuild

on:
  push:
    paths:
      - '.github/workflows/one-time-v042-stability-rebuild.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore v0.4.1 application baseline
        run: |
          set -euo pipefail
          BASE=b4b1167e1dfe1775fbd7745cb606552c57133d12
          git show "$BASE:index.html" > index.html
          git show "$BASE:config.js" > config.js

      - name: Apply isolated v0.4.2 security integration
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Static browser security only. No application permission logic is changed here.
          marker = '  <meta name="color-scheme" content="dark light" />\n'
          security_meta = (
              '  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex" />\n'
              '  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex" />\n'
              '  <meta name="referrer" content="no-referrer" />\n'
              '  <meta http-equiv="Content-Security-Policy" content="default-src \'self\'; base-uri \'self\'; object-src \'none\'; form-action \'self\'; script-src \'self\' \'unsafe-inline\' https://cdn.jsdelivr.net https://challenges.cloudflare.com; style-src \'self\' \'unsafe-inline\'; img-src \'self\' data: blob: https:; font-src \'self\' data:; connect-src \'self\' https://rmkjiqzcxbxwbiwqjjcz.supabase.co wss://rmkjiqzcxbxwbiwqjjcz.supabase.co https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; worker-src \'self\' blob:; manifest-src \'self\'; upgrade-insecure-requests" />\n'
          )
          if marker not in s:
              raise SystemExit('head marker not found')
          s = s.replace(marker, marker + security_meta, 1)
          s = s.replace('<title>FACILITY OPS v0.3.0 - Multi User Online</title>', '<title>FACILITY OPS v0.4.2 - Security Hardening</title>', 1)

          # Pin Supabase JS and load the security preflight BEFORE the main inline app starts.
          old_sdk = '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>'
          new_sdk = '<script data-facility-pinned-sdk="2.112.4" src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.js"></script>'
          if old_sdk not in s:
              raise SystemExit('Supabase SDK marker not found')
          s = s.replace(old_sdk, new_sdk, 1)
          if '<script src="config.js"></script>' not in s:
              raise SystemExit('config script marker not found')
          s = s.replace(
              '<script src="config.js"></script>',
              '<script src="config.js?v=042-stable-20260830"></script>\n  <script src="v042.js?v=042-stable-20260830"></script>',
              1
          )

          # Production connection settings stay unavailable, as already decided in v0.4.1.
          s = s.replace(
              '<button class="auth-tab" type="button" data-auth-tab="setup">연결 설정</button>',
              '<button class="auth-tab" type="button" data-auth-tab="setup" hidden style="display:none">연결 설정</button>',
              1
          )
          s = s.replace(
              '<div class="auth-pane" id="authPane-setup">',
              '<div class="auth-pane" id="authPane-setup" hidden style="display:none">',
              1
          )

          # Stable runtime config fallback. Publishable key is browser-safe; service-role is never used.
          a = s.index('function getRuntimeConfig(){')
          b = s.index('function saveRuntimeConfig', a)
          runtime = (
              "function getRuntimeConfig(){\n"
              "  const valid=c=>!!(c?.supabaseUrl&&c?.supabaseKey&&!String(c.supabaseUrl).includes('YOUR_PROJECT'));\n"
              "  const fileCfg=window.FACILITY_OPS_CONFIG||{};\n"
              "  if(valid(fileCfg))return {supabaseUrl:String(fileCfg.supabaseUrl).trim(),supabaseKey:String(fileCfg.supabaseKey).trim()};\n"
              "  try{const saved=JSON.parse(localStorage.getItem(LOCAL_CONFIG_KEY)||'{}');if(valid(saved))return {supabaseUrl:String(saved.supabaseUrl).trim(),supabaseKey:String(saved.supabaseKey).trim()};}catch(_){}\n"
              "  return {supabaseUrl:'https://rmkjiqzcxbxwbiwqjjcz.supabase.co',supabaseKey:'sb_publishable_Vb2sf5s6hJbr0FuNVx1oxA_Epbqu3yV'};\n"
              "}\n"
          )
          s = s[:a] + runtime + s[b:]

          # Central authentication activation path: MFA preflight happens before operational data is loaded.
          a = s.index('async function initSupabase(cfg){')
          b = s.index('function esc(', a)
          auth_core = (
              "let authActivationPromise=null;\n"
              "async function activateAuthenticatedSession(showCover=true){\n"
              "  if(!dbClient||!currentUser)return false;\n"
              "  if(authActivationPromise)return authActivationPromise;\n"
              "  authActivationPromise=(async()=>{\n"
              "    const hook=window.FACILITY_OPS_SECURITY?.beforeDataLoad;\n"
              "    if(typeof hook==='function'){const ok=await hook(dbClient,currentUser);if(!ok)return false;}\n"
              "    const gate=document.getElementById('authGate');if(gate)gate.hidden=true;\n"
              "    await loadRemoteData(showCover);\n"
              "    startRealtime();\n"
              "    return true;\n"
              "  })();\n"
              "  try{return await authActivationPromise;}finally{authActivationPromise=null;}\n"
              "}\n"
              "async function initSupabase(cfg){\n"
              "  if(!window.supabase?.createClient)throw new Error('Supabase 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.');\n"
              "  dbClient=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});\n"
              "  const {data,error}=await dbClient.auth.getSession();if(error)throw error;\n"
              "  currentUser=data.session?.user||null;\n"
              "  dbClient.auth.onAuthStateChange((_event,session)=>{\n"
              "    currentUser=session?.user||null;\n"
              "    if(currentUser){setTimeout(()=>activateAuthenticatedSession(false).catch(err=>console.error('[FACILITY OPS auth activate]',err)),0);}\n"
              "    else{const gate=document.getElementById('authGate');if(gate)gate.hidden=false;setOnlineStatus('로그인 필요',false);}\n"
              "  });\n"
              "  return currentUser;\n"
              "}\n"
          )
          s = s[:a] + auth_core + s[b:]

          # Login keeps the existing ID scheme and optionally forwards CAPTCHA token.
          a = s.index('async function loginWithPassword(email,password){')
          b = s.index('async function verifySupabaseConfig', a)
          login = (
              "async function loginWithPassword(email,password){\n"
              "  const errorEl=document.getElementById('loginError');if(errorEl)errorEl.textContent='';\n"
              "  const security=window.FACILITY_OPS_SECURITY;\n"
              "  try{\n"
              "    setOnlineStatus('로그인 중',false);\n"
              "    if(!dbClient){const cfg=getRuntimeConfig();await initSupabase(cfg);}\n"
              "    if(!dbClient?.auth)throw new Error('로그인 서버 초기화에 실패했습니다.');\n"
              "    const raw=String(email||'').trim().toLowerCase();\n"
              "    const actualEmail=raw.includes('@')?raw:raw+'@facility.local';\n"
              "    const credentials={email:actualEmail,password};\n"
              "    if(security?.captchaRequired?.()){const token=security.getCaptchaToken?.();if(!token)throw new Error('CAPTCHA 인증을 완료해 주세요.');credentials.options={captchaToken:token};}\n"
              "    const {data,error}=await dbClient.auth.signInWithPassword(credentials);if(error)throw error;\n"
              "    currentUser=data.user;\n"
              "    const ok=await activateAuthenticatedSession(true);if(!ok)setOnlineStatus('로그인 필요',false);\n"
              "  }catch(err){console.error('[FACILITY OPS login]',err);if(errorEl)errorEl.textContent=err?.message||'로그인에 실패했습니다.';setOnlineStatus('로그인 필요',false);}\n"
              "  finally{try{security?.resetCaptcha?.();}catch(_){}}\n"
              "}\n"
          )
          s = s[:a] + login + s[b:]

          # Existing session restore uses the same MFA-aware activation path.
          a = s.index('async function bootConnection(cfg,fromSetup=false){')
          b = s.index('async function init(){', a)
          boot = (
              "async function bootConnection(cfg,fromSetup=false){\n"
              "  try{\n"
              "    setOnlineStatus('연결 확인 중',false);\n"
              "    await verifySupabaseConfig(cfg);\n"
              "    const user=await initSupabase(cfg);\n"
              "    if(user){await activateAuthenticatedSession(true);}\n"
              "    else{const gate=document.getElementById('authGate');if(gate)gate.hidden=false;setAuthTab('login');setOnlineStatus('로그인 필요',false);if(fromSetup)showLoginConnectionSuccess();}\n"
              "  }catch(err){\n"
              "    console.error(err);\n"
              "    const gate=document.getElementById('authGate');if(gate)gate.hidden=false;setAuthTab('login');\n"
              "    const el=document.getElementById('loginError');if(el)el.textContent='서버 연결 오류 · '+(err?.message||'Supabase 연결을 확인해 주세요.');\n"
              "    setOnlineStatus('연결 오류',false);\n"
              "  }\n"
              "}\n"
          )
          s = s[:a] + boot + s[b:]

          p.write_text(s, encoding='utf-8')

          # v0.4.1 bootstrap remains the owner of role visibility / CRUD permissions.
          cp = Path('config.js')
          c = cp.read_text(encoding='utf-8')
          c = c.replace("v04.js?v=041-base", "v04.js?v=042-stable-base")
          c = c.replace("v041.js?v=041", "v041.js?v=042-stable-core")
          cp.write_text(c, encoding='utf-8')

      - name: Write isolated v0.4.2 security module
        run: |
          cat > v042.js <<'EOF'
          // FACILITY OPS v0.4.2 — SECURITY HARDENING (isolated)
          // This module must not replace v0.4/v0.4.1 CRUD or role-permission functions.
          (function(){
            const CFG=window.FACILITY_OPS_CONFIG||{};
            const SITE_KEY=String(CFG.turnstileSiteKey||'').trim();
            const SDK_VERSION=String(CFG.supabaseJsVersion||'2.112.4');
            const PASSWORD=Object.assign({minLength:12,requireLower:true,requireUpper:true,requireNumber:true,requireSymbol:true},CFG.passwordPolicy||{});
            let captchaToken='';
            let captchaWidgetId=null;
            let lastClient=null;
            let lastProfile=null;
            let mfaGate=null;

            function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
            function isAdminProfile(p){return p?.approved!==false&&p?.role==='admin';}
            function qrSource(raw){const t=String(raw||'');if(t.startsWith('data:'))return t;if(t.trim().startsWith('<svg'))return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(t);return t;}

            function injectStyle(){
              if(document.getElementById('facilityOpsV042Style'))return;
              const style=document.createElement('style');
              style.id='facilityOpsV042Style';
              style.textContent=`
                .sidebar .version{font-size:0!important}.sidebar .version::after{content:"FACILITY OPS v0.4.2 SECURITY HARDENING"!important;font-size:10px!important}
                .auth-logo p{font-size:0!important}.auth-logo p::after{content:"v0.4.2 SECURITY HARDENING"!important;font-size:11px!important}
                .v042-overlay{position:fixed;inset:0;z-index:180;background:rgba(2,8,14,.86);backdrop-filter:blur(10px);display:grid;place-items:center;padding:22px}.v042-overlay[hidden]{display:none}
                .v042-card{width:min(520px,96vw);max-height:92vh;overflow:auto;border:1px solid var(--line-strong);border-radius:22px;background:linear-gradient(145deg,var(--panel),var(--panel-2));box-shadow:0 30px 100px rgba(0,0,0,.52);padding:24px}
                .v042-card h2{margin:6px 0 8px;font-size:21px}.v042-card p{color:var(--muted);font-size:11px;line-height:1.65;margin:0 0 15px}
                .v042-qr{display:grid;place-items:center;background:#fff;border-radius:14px;padding:12px;width:220px;height:220px;margin:12px auto}.v042-qr img{max-width:196px;max-height:196px}
                .v042-secret{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;word-break:break-all;border:1px solid var(--line);background:var(--panel-3);border-radius:10px;padding:10px;color:var(--soft);font-size:10px;margin:9px 0 14px}
                .v042-code{width:100%;min-height:46px;border:1px solid var(--line);border-radius:11px;background:var(--panel-2);color:var(--text);padding:0 12px;font-size:18px;letter-spacing:.18em;text-align:center;outline:none}
                .v042-actions{display:flex;gap:8px;margin-top:12px}.v042-actions>*{flex:1}.v042-error{min-height:18px;color:var(--alert);font-size:10px;margin-top:9px;text-align:center}
                .v042-sec-list{display:grid;gap:8px;margin-top:14px}.v042-sec-item{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:start;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--panel-2)}.v042-sec-item b{font-size:10px}.v042-sec-item span{font-size:11px;color:var(--soft);line-height:1.5}
              `;
              document.head.appendChild(style);
            }

            function ensureMfaOverlay(){
              let root=document.getElementById('adminMfaV042');
              if(root)return root;
              root=document.createElement('div');
              root.id='adminMfaV042';root.className='v042-overlay';root.hidden=true;
              root.innerHTML=`<div class="v042-card" role="dialog" aria-modal="true" aria-label="관리자 2단계 인증">
                <div class="eyebrow">FACILITY OPS / ADMIN SECURITY</div><h2 id="v042MfaTitle">관리자 2단계 인증</h2>
                <p id="v042MfaHelp">관리자 계정은 비밀번호 인증 후 Authenticator 앱의 6자리 코드가 필요합니다.</p>
                <div id="v042EnrollBox" hidden><div class="v042-qr"><img id="v042MfaQr" alt="2FA QR 코드"></div><div class="v042-secret" id="v042MfaSecret"></div></div>
                <input class="v042-code" id="v042MfaCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000">
                <div class="v042-actions"><button class="primary-btn" type="button" id="v042MfaVerify">인증</button><button class="ghost-btn" type="button" id="v042MfaLogout">로그아웃</button></div>
                <div class="v042-error" id="v042MfaError"></div></div>`;
              document.body.appendChild(root);
              root.querySelector('#v042MfaVerify').onclick=verifyMfa;
              root.querySelector('#v042MfaCode').addEventListener('keydown',e=>{if(e.key==='Enter')verifyMfa();});
              root.querySelector('#v042MfaLogout').onclick=async()=>{const gate=mfaGate;try{await gate?.client?.auth?.signOut();}catch(_){}root.hidden=true;if(gate){mfaGate=null;gate.resolve(false);}};
              return root;
            }

            async function prepareMfa(){
              const gate=mfaGate;if(!gate||gate.busy)return;
              gate.busy=true;
              const root=ensureMfaOverlay();const errorEl=root.querySelector('#v042MfaError');
              errorEl.textContent='2FA 정보를 확인하는 중...';
              try{
                const {data,error}=await gate.client.auth.mfa.listFactors();if(error)throw error;
                gate.factor=(data?.totp||[]).find(x=>!x.status||x.status==='verified')||null;
                if(gate.factor){
                  gate.enrollment=null;root.querySelector('#v042MfaTitle').textContent='관리자 2단계 인증';root.querySelector('#v042MfaHelp').textContent='Authenticator 앱에 표시되는 6자리 코드를 입력하세요.';root.querySelector('#v042EnrollBox').hidden=true;
                }else{
                  const enrolled=await gate.client.auth.mfa.enroll({factorType:'totp',friendlyName:'FACILITY OPS 관리자'});if(enrolled.error)throw enrolled.error;
                  gate.enrollment=enrolled.data;gate.factor=enrolled.data;
                  root.querySelector('#v042MfaTitle').textContent='관리자 2FA 최초 등록';root.querySelector('#v042MfaHelp').textContent='Authenticator 앱에서 QR 코드를 스캔한 뒤 표시되는 6자리 코드를 입력하세요.';
                  root.querySelector('#v042EnrollBox').hidden=false;root.querySelector('#v042MfaQr').src=qrSource(enrolled.data?.totp?.qr_code||'');root.querySelector('#v042MfaSecret').textContent=enrolled.data?.totp?.secret?'수동 등록 키: '+enrolled.data.totp.secret:'QR 코드를 스캔해 주세요.';
                }
                errorEl.textContent='';setTimeout(()=>root.querySelector('#v042MfaCode')?.focus(),20);
              }catch(err){console.error('[FACILITY OPS v0.4.2 MFA prepare]',err);errorEl.textContent=err?.message||'2FA 정보를 준비하지 못했습니다.';}
              finally{gate.busy=false;}
            }

            async function verifyMfa(){
              const gate=mfaGate;if(!gate||gate.busy)return;
              const root=ensureMfaOverlay();const input=root.querySelector('#v042MfaCode');const errorEl=root.querySelector('#v042MfaError');
              const code=String(input?.value||'').replace(/\D/g,'').slice(0,6);if(code.length!==6){errorEl.textContent='Authenticator의 6자리 코드를 입력해 주세요.';return;}
              const factorId=gate.factor?.id||gate.enrollment?.id;if(!factorId){await prepareMfa();return;}
              gate.busy=true;const btn=root.querySelector('#v042MfaVerify');btn.disabled=true;btn.textContent='확인 중...';errorEl.textContent='';
              try{
                const {error}=await gate.client.auth.mfa.challengeAndVerify({factorId,code});if(error)throw error;
                const aal=await gate.client.auth.mfa.getAuthenticatorAssuranceLevel();if(aal.error)throw aal.error;if(aal.data?.currentLevel!=='aal2')throw new Error('2단계 인증 세션으로 승격되지 않았습니다.');
                root.hidden=true;input.value='';const done=mfaGate;mfaGate=null;done.resolve(true);
              }catch(err){console.error('[FACILITY OPS v0.4.2 MFA verify]',err);errorEl.textContent='인증 실패 · '+(err?.message||'코드를 다시 확인해 주세요.');input?.select();}
              finally{gate.busy=false;btn.disabled=false;btn.textContent='인증';}
            }

            async function requireAdminMfa(client){
              if(mfaGate)return mfaGate.promise;
              let resolve;const promise=new Promise(r=>resolve=r);mfaGate={client,resolve,promise,factor:null,enrollment:null,busy:false};
              const root=ensureMfaOverlay();root.hidden=false;await prepareMfa();return promise;
            }

            async function beforeDataLoad(client,user){
              lastClient=client;
              if(!client||!user)return false;
              const profileResult=await client.from('profiles').select('id,display_name,role,approved').eq('id',user.id).maybeSingle();
              if(profileResult.error)throw profileResult.error;
              lastProfile=profileResult.data||null;
              if(lastProfile?.approved===false){try{await client.auth.signOut();}catch(_){}const el=document.getElementById('loginError');if(el)el.textContent='이 계정은 아직 관리자의 사용 승인을 받지 않았습니다.';return false;}
              if(!isAdminProfile(lastProfile))return true;
              const aal=await client.auth.mfa.getAuthenticatorAssuranceLevel();if(aal.error)throw aal.error;
              if(aal.data?.currentLevel==='aal2')return true;
              return requireAdminMfa(client);
            }

            function captchaRequired(){return !!SITE_KEY;}
            function getCaptchaToken(){return captchaToken;}
            function resetCaptcha(){captchaToken='';try{if(window.turnstile&&captchaWidgetId!==null)window.turnstile.reset(captchaWidgetId);}catch(_){}}
            function renderCaptcha(){
              if(!SITE_KEY||!window.turnstile)return;const box=document.getElementById('facilityCaptchaV042');if(!box||captchaWidgetId!==null)return;
              try{captchaWidgetId=window.turnstile.render(box,{sitekey:SITE_KEY,theme:'auto',callback:t=>captchaToken=String(t||''),'expired-callback':()=>captchaToken='','error-callback':()=>captchaToken='' });}catch(err){console.error('[FACILITY OPS v0.4.2 CAPTCHA]',err);}
            }
            function mountCaptcha(){
              if(!SITE_KEY)return;const form=document.getElementById('loginForm');if(!form)return;
              let box=document.getElementById('facilityCaptchaV042');if(!box){box=document.createElement('div');box.id='facilityCaptchaV042';box.style.cssText='display:grid;place-items:center;min-height:0;margin-top:2px';const submit=form.querySelector('button[type="submit"]');form.insertBefore(box,submit||null);}
              if(window.turnstile){renderCaptcha();return;}if(document.getElementById('facilityTurnstileV042'))return;
              const script=document.createElement('script');script.id='facilityTurnstileV042';script.src='https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';script.async=true;script.defer=true;script.onload=renderCaptcha;document.head.appendChild(script);
            }

            function ensureSecurityOverlay(){
              let root=document.getElementById('securityTestV042');if(root)return root;
              root=document.createElement('div');root.id='securityTestV042';root.className='v042-overlay';root.hidden=true;
              root.innerHTML=`<div class="v042-card" role="dialog" aria-modal="true"><div class="eyebrow">FACILITY OPS / SECURITY TEST</div><h2>운영 보안 자가점검</h2><p>보안 레이어만 점검하며 기존 사용자 권한 로직은 변경하지 않습니다.</p><div class="v042-sec-list" id="v042SecurityList"></div><div class="v042-actions"><button class="primary-btn" id="v042SecurityAgain" type="button">다시 점검</button><button class="ghost-btn" id="v042SecurityClose" type="button">닫기</button></div></div>`;
              document.body.appendChild(root);root.querySelector('#v042SecurityClose').onclick=()=>root.hidden=true;root.querySelector('#v042SecurityAgain').onclick=runSecurityTest;return root;
            }
            function ensureSecurityButton(){
              const logout=document.getElementById('logoutBtn');if(!logout)return;let btn=document.getElementById('securityTestBtnV042');
              if(!btn){btn=document.createElement('button');btn.id='securityTestBtnV042';btn.type='button';btn.className='ghost-btn full';btn.textContent='보안 점검';btn.onclick=runSecurityTest;logout.parentNode.insertBefore(btn,logout);}
              const admin=document.querySelector('#userChip small')?.textContent?.trim()==='관리자';btn.hidden=!admin;btn.style.display=admin?'':'none';
            }
            async function runSecurityTest(){
              if(document.querySelector('#userChip small')?.textContent?.trim()!=='관리자')return;
              const root=ensureSecurityOverlay();root.hidden=false;const list=root.querySelector('#v042SecurityList');const rows=[];const add=(ok,title,text)=>rows.push({ok,title,text});
              add(location.protocol==='https:','HTTPS',location.protocol==='https:'?'HTTPS 접속':'HTTPS가 아닙니다.');
              const csp=document.querySelector('meta[http-equiv="Content-Security-Policy"]')?.content||'';add(csp.includes("default-src 'self'")&&csp.includes("object-src 'none'"),'CSP',csp?'CSP 적용됨':'CSP 없음');
              const robots=document.querySelector('meta[name="robots"]')?.content||'';add(/noindex/i.test(robots),'NOINDEX',/noindex/i.test(robots)?'검색 색인 차단':'noindex 없음');
              add(!!document.querySelector(`[data-facility-pinned-sdk="${SDK_VERSION}"]`),'SDK PIN','Supabase JS '+SDK_VERSION+' 고정');
              const setupVisible=[...document.querySelectorAll('[data-auth-tab="setup"],#authPane-setup')].some(x=>!x.hidden&&getComputedStyle(x).display!=='none');add(!setupVisible,'운영 연결','Supabase 연결 변경 UI '+(setupVisible?'노출됨':'제거됨'));
              add(SITE_KEY,'CAPTCHA',SITE_KEY?'Turnstile Site Key 설정됨':'Site Key 미설정');
              add(PASSWORD.minLength>=12&&PASSWORD.requireLower&&PASSWORD.requireUpper&&PASSWORD.requireNumber&&PASSWORD.requireSymbol,'비밀번호 정책',`${PASSWORD.minLength}자 + 대/소문자 + 숫자 + 기호 목표`);
              if(lastClient){try{const r=await lastClient.rpc('facility_ops_security_status');if(r.error)throw r.error;add(!r.data?.admin_role||r.data?.admin_mfa_ok,'관리자 2FA',r.data?.admin_role?'현재 AAL: '+(r.data?.aal||'-'):'일반 사용자');}catch(err){add(false,'DB SECURITY','v0.4.2 SQL 적용 확인 필요 · '+(err?.message||err));}}
              list.innerHTML=rows.map(x=>`<div class="v042-sec-item"><b>${x.ok?'PASS':'CHECK'}</b><span><strong>${esc(x.title)}</strong><br>${esc(x.text)}</span></div>`).join('');
            }

            window.FACILITY_OPS_SECURITY={beforeDataLoad,captchaRequired,getCaptchaToken,resetCaptcha,runSecurityTest};
            document.addEventListener('DOMContentLoaded',()=>{mountCaptcha();ensureMfaOverlay();ensureSecurityOverlay();setTimeout(injectStyle,700);setTimeout(ensureSecurityButton,800);const observer=new MutationObserver(()=>ensureSecurityButton());observer.observe(document.body,{childList:true,subtree:true,characterData:true});},{once:true});
          })();
          EOF

      - name: Keep DB security additive to v0.4.1 permissions
        run: |
          cat > supabase_v0.4.2_security_hardening.sql <<'SQL'
          -- FACILITY OPS v0.4.2 — SECURITY HARDENING
          -- 선행: supabase_v0.4_upgrade.sql + supabase_v0.4.1_security_core.sql
          -- 기존 role/작성자 권한 구조는 유지하고, 관리자 권한 사용 시 AAL2(TOTP)를 추가 요구합니다.
          begin;

          create or replace function public.facility_ops_has_admin_role()
          returns boolean
          language sql stable security definer set search_path=''
          as $$
            select exists(select 1 from public.profiles p where p.id=auth.uid() and p.approved=true and p.role='admin');
          $$;

          -- 기존 관리자 RPC들이 이 함수를 사용하므로 관리자 중요 작업은 자동으로 AAL2가 필요합니다.
          -- UI의 관리자/일반사용자 구분은 profiles.role을 그대로 사용하므로 역할 경계는 변하지 않습니다.
          create or replace function public.facility_ops_is_admin()
          returns boolean
          language sql stable security definer set search_path=''
          as $$
            select public.facility_ops_has_admin_role() and coalesce(auth.jwt()->>'aal','aal1')='aal2';
          $$;

          create or replace function public.facility_ops_can_edit()
          returns boolean
          language sql stable security definer set search_path=''
          as $$
            select exists(
              select 1 from public.profiles p
              where p.id=auth.uid() and p.approved=true and
                (p.role='member' or (p.role='admin' and coalesce(auth.jwt()->>'aal','aal1')='aal2'))
            );
          $$;

          grant execute on function public.facility_ops_has_admin_role() to authenticated;
          grant execute on function public.facility_ops_is_admin() to authenticated;
          grant execute on function public.facility_ops_can_edit() to authenticated;

          -- 승인 일반사용자는 기존처럼 조회 가능. 관리자 계정은 2FA 완료 후 운영 데이터를 조회합니다.
          do $$
          declare t text;
          begin
            foreach t in array array['facilities','inspections','issues','schedules'] loop
              execute format('drop policy if exists %I on public.%I',t||'_read',t);
              execute format('create policy %I on public.%I for select to authenticated using (public.facility_ops_is_approved() and deleted_at is null and (not public.facility_ops_has_admin_role() or public.facility_ops_is_admin()))',t||'_read',t);
              execute format('drop policy if exists %I on public.%I',t||'_insert_v041',t);
              execute format('create policy %I on public.%I for insert to authenticated with check (public.facility_ops_can_edit() and created_by=auth.uid() and deleted_at is null)',t||'_insert_v041',t);
              execute format('drop policy if exists %I on public.%I',t||'_update_v041',t);
              execute format('create policy %I on public.%I for update to authenticated using (public.facility_ops_can_edit() and deleted_at is null and (public.facility_ops_is_admin() or created_by=auth.uid())) with check (public.facility_ops_can_edit() and deleted_at is null and (public.facility_ops_is_admin() or created_by=auth.uid()))',t||'_update_v041',t);
            end loop;
          end $$;

          -- 본인 profile 조회 정책은 v0.4.1 그대로 유지됩니다. 전체 profile/audit 조회는 AAL2 관리자만.
          drop policy if exists "profiles_read_admin" on public.profiles;
          create policy "profiles_read_admin" on public.profiles for select to authenticated using (public.facility_ops_is_admin());
          drop policy if exists "audit_logs_admin_read" on public.audit_logs;
          create policy "audit_logs_admin_read" on public.audit_logs for select to authenticated using (public.facility_ops_is_admin());

          create or replace function public.facility_ops_security_status()
          returns jsonb
          language plpgsql stable security definer set search_path=''
          as $$
          declare v_role text;v_approved boolean;v_aal text:=coalesce(auth.jwt()->>'aal','aal1');
          begin
            if auth.uid() is null then raise exception '로그인이 필요합니다.' using errcode='42501'; end if;
            select p.role,p.approved into v_role,v_approved from public.profiles p where p.id=auth.uid();
            return jsonb_build_object('user_id',auth.uid(),'role',coalesce(v_role,'unknown'),'approved',coalesce(v_approved,false),'aal',v_aal,'admin_role',coalesce(v_role='admin',false),'admin_mfa_ok',case when v_role='admin' then v_aal='aal2' else true end,'server_time',now());
          end;
          $$;
          revoke all on function public.facility_ops_security_status() from public;
          grant execute on function public.facility_ops_security_status() to authenticated;

          commit;

          -- Supabase Dashboard에서 별도 설정
          -- 1) Authentication > MFA : TOTP 활성화
          -- 2) Authentication > Bot and Abuse Protection : Turnstile CAPTCHA 활성화 + Secret Key 입력
          -- 3) Authentication > Password Security : 최소 12자 및 강한 비밀번호 정책 적용
          SQL

          cat > robots.txt <<'EOF'
          User-agent: *
          Disallow: /
          EOF

