        run: |
          set -euo pipefail
          node --check config.js
          node --check v04.js
          node --check v041.js
          node --check v042.js
          git diff --exit-code b4b1167e1dfe1775fbd7745cb606552c57133d12 -- v04.js v041.js
          grep -q "function canModify(type, id)" v041.js
          grep -q "item.createdBy === uid()" v041.js
          grep -q "function canDelete(type, id)" v04.js
          grep -q "item.createdBy === uid()" v04.js
          grep -q "facility_ops_admin_import_backup" v041.js
          grep -q "사용자 · 변경이력 관리" v04.js
          ! grep -q "deleteItem =" v042.js
          ! grep -q "openModal =" v042.js
          ! grep -q "canEdit =" v042.js
          grep -q "FACILITY_OPS_SECURITY?.beforeDataLoad" index.html
          grep -q "data-facility-pinned-sdk=\"2.112.4\"" index.html

      - name: Commit stable rebuild
        run: |
          git config user.name "facility-ops-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html config.js v042.js supabase_v0.4.2_security_hardening.sql robots.txt
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild v0.4.2 security on stable v0.4.1 core"
          git push
