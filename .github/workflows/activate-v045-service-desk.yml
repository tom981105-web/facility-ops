name: Activate v045 SERVICE DESK

on:
  push:
    paths:
      - '.github/workflows/activate-v045-service-desk.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire isolated SERVICE DESK layer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('config.js')
          s=p.read_text(encoding='utf-8')
          if 'facilityOpsServiceDesk045' not in s:
              lines=s.splitlines()
              out=[]
              done=False
              for line in lines:
                  out.append(line)
                  if not done and 'smart.async = false;' in line:
                      indent=line[:len(line)-len(line.lstrip())]
                      out.extend([
                          indent+'smart.onload = function() {',
                          indent+"  if (!document.getElementById('facilityOpsServiceDesk045')) {",
                          indent+"    const desk = document.createElement('script');",
                          indent+"    desk.id = 'facilityOpsServiceDesk045';",
                          indent+"    desk.src = 'v045.js?v=045-service-desk-20260830';",
                          indent+'    desk.async = false;',
                          indent+'    document.body.appendChild(desk);',
                          indent+'  }',
                          indent+'};'
                      ])
                      done=True
              if not done:
                  raise SystemExit('smart.async loader line not found')
              s='\n'.join(out)+'\n'
          p.write_text(s,encoding='utf-8')
          assert s.count('facilityOpsServiceDesk045') >= 2
          assert 'v045.js?v=045-service-desk-20260830' in s
          PY
          node --check config.js
          node --check v044.js
          node --check v045.js
      - name: Commit activation
        run: |
          git config user.name 'facility-ops-ui-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add config.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Activate FACILITY OPS v0.4.5 SERVICE DESK'
          git push
