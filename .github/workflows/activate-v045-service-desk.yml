name: Activate v045 SERVICE DESK

on:
  push:
    paths:
      - '.github/workflows/activate-v045-service-desk.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire isolated SERVICE DESK layer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('config.js')
          s=p.read_text(encoding='utf-8')
          if 'facilityOpsServiceDesk045' not in s:
              old="""                      smart.src = 'v044.js?v=044-smart-ops-20260830';
                      smart.async = false;
                      document.body.appendChild(smart);"""
              new="""                      smart.src = 'v044.js?v=044-smart-ops-20260830';
                      smart.async = false;
                      smart.onload = function() {
                        if (!document.getElementById('facilityOpsServiceDesk045')) {
                          const desk = document.createElement('script');
                          desk.id = 'facilityOpsServiceDesk045';
                          desk.src = 'v045.js?v=045-service-desk-20260830';
                          desk.async = false;
                          document.body.appendChild(desk);
                        }
                      };
                      document.body.appendChild(smart);"""
              if old not in s:
                  raise SystemExit('v0.4.4 loader block not found')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          assert 'facilityOpsServiceDesk045' in s
          assert 'v045.js?v=045-service-desk-20260830' in s
          PY
          node --check config.js
          node --check v044.js
          node --check v045.js
      - name: Commit activation
        run: |
          git config user.name 'facility-ops-ui-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add config.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Activate FACILITY OPS v0.4.5 SERVICE DESK'
          git push
