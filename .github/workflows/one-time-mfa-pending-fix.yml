name: One-time MFA pending factor fix

on:
  push:
    paths:
      - '.github/workflows/one-time-mfa-pending-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix stale unverified TOTP enrollment
        shell: python
        run: |
          from pathlib import Path
          p = Path('v042.js')
          s = p.read_text(encoding='utf-8')
          a = s.index('  async function prepareMfa(){')
          b = s.index('  async function verifyMfa(){', a)
          new = (
            "  async function prepareMfa(){\n"
            "    const gate=mfaGate;if(!gate||gate.busy)return;\n"
            "    gate.busy=true;\n"
            "    const root=ensureMfaOverlay();const errorEl=root.querySelector('#v042MfaError');\n"
            "    errorEl.textContent='2FA 정보를 확인하는 중...';\n"
            "    try{\n"
            "      const listed=await gate.client.auth.mfa.listFactors();if(listed.error)throw listed.error;\n"
            "      const factors=listed.data?.totp||[];\n"
            "      const verified=factors.find(x=>x.status==='verified')||null;\n"
            "      if(verified){\n"
            "        gate.factor=verified;gate.enrollment=null;\n"
            "        root.querySelector('#v042MfaTitle').textContent='관리자 2단계 인증';\n"
            "        root.querySelector('#v042MfaHelp').textContent='Authenticator 앱에 표시되는 6자리 코드를 입력하세요.';\n"
            "        root.querySelector('#v042EnrollBox').hidden=true;\n"
            "      }else{\n"
            "        const pending=factors.filter(x=>x.status!=='verified');\n"
            "        for(const factor of pending){\n"
            "          if(!factor?.id)continue;\n"
            "          const removed=await gate.client.auth.mfa.unenroll({factorId:factor.id});\n"
            "          if(removed.error)console.warn('[FACILITY OPS v0.4.2 MFA stale cleanup]',removed.error);\n"
            "        }\n"
            "        const friendly='FACILITY OPS 관리자 '+String(Date.now()).slice(-6);\n"
            "        const enrolled=await gate.client.auth.mfa.enroll({factorType:'totp',friendlyName:friendly});if(enrolled.error)throw enrolled.error;\n"
            "        gate.enrollment=enrolled.data;gate.factor=enrolled.data;\n"
            "        root.querySelector('#v042MfaTitle').textContent='관리자 2FA 최초 등록';\n"
            "        root.querySelector('#v042MfaHelp').textContent='① Authenticator 앱에서 새 QR을 스캔 → ② 앱에 표시되는 6자리 코드 입력 → ③ 인증을 누르세요.';\n"
            "        root.querySelector('#v042EnrollBox').hidden=false;\n"
            "        root.querySelector('#v042MfaQr').src=qrSource(enrolled.data?.totp?.qr_code||'');\n"
            "        root.querySelector('#v042MfaSecret').textContent=enrolled.data?.totp?.secret?'수동 등록 키: '+enrolled.data.totp.secret:'QR 코드를 스캔해 주세요.';\n"
            "      }\n"
            "      errorEl.textContent='';setTimeout(()=>root.querySelector('#v042MfaCode')?.focus(),20);\n"
            "    }catch(err){console.error('[FACILITY OPS v0.4.2 MFA prepare]',err);errorEl.textContent=err?.message||'2FA 정보를 준비하지 못했습니다.';}\n"
            "    finally{gate.busy=false;}\n"
            "  }\n\n"
          )
          s = s[:a] + new + s[b:]
          p.write_text(s, encoding='utf-8')

          idx = Path('index.html')
          h = idx.read_text(encoding='utf-8')
          h = h.replace('v042.js?v=042-stable-20260830','v042.js?v=042-mfa-fix-20260830')
          idx.write_text(h, encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name "facility-ops-bot"
          git config user.email "actions@users.noreply.github.com"
          git add v042.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix duplicate pending MFA enrollment"
          git push
