name: Replace logo with exact user asset

on:
  push:
    paths:
      - '.github/workflows/replace-logo-with-exact.yml'

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode exact logo
        run: |
          cat .logo-real-0.b64 .logo-real-1.b64 .logo-real-2.b64 .logo-real-3.b64 | base64 -d > facility-logo.webp
          test -s facility-logo.webp
          file facility-logo.webp
          python - <<'PY'
          from PIL import Image
          im=Image.open('facility-logo.webp')
          print(im.format, im.size, im.mode)
          assert im.format == 'WEBP'
          assert im.size == (256,256)
          PY
      - name: Commit exact logo
        run: |
          git config user.name 'facility-ops-ui-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add facility-logo.webp
          git commit -m 'Use exact provided FACILITY OPS logo asset'
          git push
