name: Final static logo deployment

on:
  push:
    paths:
      - '.github/workflows/final-static-logo.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract real logo file and mount directly in HTML
        shell: python
        run: |
          from pathlib import Path
          import re, base64

          # 1) Extract the exact embedded FACILITY OPS logo from v043_ui.js.
          ui = Path('v043_ui.js').read_text(encoding='utf-8')
          marker = 'const LOGO='
          start = ui.find(marker)
          if start < 0:
              raise SystemExit('LOGO declaration not found')
          end = ui.find(';\n', start)
          if end < 0:
              raise SystemExit('LOGO declaration end not found')
          expr = ui[start + len(marker):end]
          parts = re.findall(r"'([^']*)'", expr)
          data_uri = ''.join(parts)
          m = re.fullmatch(r'data:image/([a-zA-Z0-9.+-]+);base64,(.+)', data_uri, flags=re.S)
          if not m:
              raise SystemExit('Embedded logo data URI is invalid')
          ext = m.group(1).lower()
          if ext == 'jpeg': ext = 'jpg'
          raw = base64.b64decode(m.group(2), validate=True)
          if len(raw) < 1000:
              raise SystemExit('Decoded logo is unexpectedly small')

          # The current embedded asset is WebP. Save it as a real static file.
          logo_path = Path('facility-logo.webp')
          logo_path.write_bytes(raw)
          print('logo bytes:', len(raw))

          # 2) Put the image directly into index.html. No JS is required to show it.
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          # Remove earlier static mount if this workflow is ever re-run.
          html = re.sub(r'<img\s+class="facility-logo-static"[^>]*>', '', html)

          img = '<img class="facility-logo-static" src="facility-logo.webp?v=20260830-final-static" alt="FACILITY OPS" width="72" height="52">'

          # Sidebar brand: inject immediately after opening .brand container.
          brand_pat = re.compile(r'(<div\s+class="brand"[^>]*>)', re.I)
          html, n1 = brand_pat.subn(r'\1' + img, html, count=1)
          if n1 != 1:
              raise SystemExit('Could not locate sidebar .brand container')

          # Login/auth logo: inject immediately after opening .auth-logo container when present.
          auth_pat = re.compile(r'(<div\s+class="auth-logo"[^>]*>)', re.I)
          html, n2 = auth_pat.subn(r'\1' + img, html, count=1)
          # If there is no .auth-logo wrapper, sidebar logo is still mandatory and enough for this fix.

          css = '''\n/* FINAL STATIC FACILITY OPS LOGO — no JavaScript dependency */\n.facility-logo-static{display:block!important;visibility:visible!important;opacity:1!important;width:72px!important;height:52px!important;min-width:72px!important;max-width:72px!important;object-fit:contain!important;object-position:center!important;flex:0 0 72px!important;filter:none!important;transform:none!important;background:transparent!important;position:relative!important;z-index:999!important}\n.brand>.facility-logo-static{margin:0 2px 0 0!important}\n.auth-logo>.facility-logo-static{width:108px!important;height:76px!important;min-width:108px!important;max-width:108px!important;margin:0 auto 10px!important}\n.brand>.brand-mark,.auth-logo>.brand-mark{display:none!important}\n.brand>.facility-brand-logo,.brand>.facility-brand-logo-final,.auth-logo>.facility-brand-logo,.auth-logo>.facility-brand-logo-final{display:none!important}\n'''
          if 'FINAL STATIC FACILITY OPS LOGO' not in html:
              html = html.replace('</style>', css + '\n</style>', 1)

          # Preload the real file so it is available before the JS boot chain begins.
          preload = '<link rel="preload" as="image" href="facility-logo.webp?v=20260830-final-static" type="image/webp">\n'
          if 'facility-logo.webp?v=20260830-final-static' not in html.split('</head>',1)[0]:
              html = html.replace('</head>', preload + '</head>', 1)

          p.write_text(html, encoding='utf-8')

          # 3) Sanity checks.
          final = p.read_text(encoding='utf-8')
          if final.count('class="facility-logo-static"') < 1:
              raise SystemExit('Static logo img was not inserted')
          if 'facility-logo.webp?v=20260830-final-static' not in final:
              raise SystemExit('Static logo URL missing')
          print('sidebar mount:', n1, 'auth mount:', n2)

      - name: Validate output
        run: |
          test -s facility-logo.webp
          grep -q 'class="facility-logo-static"' index.html
          grep -q 'facility-logo.webp?v=20260830-final-static' index.html
          file facility-logo.webp
          node --check config.js
          node --check v043_ui.js
          node --check v043_logo_fix.js

      - name: Commit final static logo
        run: |
          git config user.name 'facility-ops-ui-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html facility-logo.webp
          git commit -m 'Render FACILITY OPS logo as static image file'
          git push
