name: One-time runtime config fallback

on:
  push:
    paths:
      - '.github/workflows/one-time-runtime-config-fallback.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch runtime config fallback
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.index('function getRuntimeConfig(){')
          end = s.index('function saveRuntimeConfig', start)
          new = (
              "function getRuntimeConfig(){\n"
              "  const valid=c=>!!(c?.supabaseUrl&&c?.supabaseKey&&!String(c.supabaseUrl).includes('YOUR_PROJECT'));\n"
              "  const fileCfg=window.FACILITY_OPS_CONFIG||{};\n"
              "  if(valid(fileCfg))return {supabaseUrl:String(fileCfg.supabaseUrl).trim(),supabaseKey:String(fileCfg.supabaseKey).trim()};\n"
              "  try{const saved=JSON.parse(localStorage.getItem(LOCAL_CONFIG_KEY)||'{}');if(valid(saved))return {supabaseUrl:String(saved.supabaseUrl).trim(),supabaseKey:String(saved.supabaseKey).trim()};}catch(_){}\n"
              "  return {supabaseUrl:'https://rmkjiqzcxbxwbiwqjjcz.supabase.co',supabaseKey:'sb_publishable_Vb2sf5s6hJbr0FuNVx1oxA_Epbqu3yV'};\n"
              "}\n"
          )
          s = s[:start] + new + s[end:]
          s = s.replace('config.js?v=0423-loginfix-20260830','config.js?v=0424-configfix-20260830')
          p.write_text(s, encoding='utf-8')
      - name: Commit runtime config fix
        run: |
          git config user.name "facility-ops-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix runtime Supabase config fallback"
          git push
