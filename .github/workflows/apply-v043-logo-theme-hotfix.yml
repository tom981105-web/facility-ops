name: Apply v0.4.3 logo theme hotfix

on:
  push:
    paths:
      - '.github/workflows/apply-v043-logo-theme-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump logo-theme hotfix cache key
        shell: python
        run: |
          from pathlib import Path
          p=Path('config.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("v043_logo_fix.js?v=043-logo-fix-20260830", "v043_logo_fix.js?v=043-logo-theme-hotfix-20260830b")
          p.write_text(s,encoding='utf-8')
      - name: Validate
        run: |
          node --check config.js
          node --check v043_logo_fix.js
          grep -q "043-logo-theme-hotfix-20260830b" config.js
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'facility-ops-ui-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add config.js
          git commit -m 'Activate logo and complete light theme hotfix'
          git push
