name: Activate v044 SMART OPS

on:
  push:
    paths:
      - '.github/workflows/activate-v044-smart-ops.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix SMART OPS syntax and wire isolated layer
        run: |
          python - <<'PY'
          from pathlib import Path

          # Fix the CSS template-literal terminator in v044.js.
          vp=Path('v044.js')
          vs=vp.read_text(encoding='utf-8')
          bad="}};\n    document.head.appendChild(style);"
          good="}}`;\n    document.head.appendChild(style);"
          if bad in vs:
              vs=vs.replace(bad,good,1)
          vp.write_text(vs,encoding='utf-8')

          # Load v0.4.4 only after the existing v0.4.3 polish layer finishes.
          p=Path('config.js')
          s=p.read_text(encoding='utf-8')
          if 'facilityOpsSmartOps044' not in s:
              lines=s.splitlines()
              done=False
              out=[]
              for line in lines:
                  out.append(line)
                  if not done and "polish.async = false;" in line:
                      indent=line[:len(line)-len(line.lstrip())]
                      out.extend([
                          indent+"polish.onload = function() {",
                          indent+"  if (!document.getElementById('facilityOpsSmartOps044')) {",
                          indent+"    const smart = document.createElement('script');",
                          indent+"    smart.id = 'facilityOpsSmartOps044';",
                          indent+"    smart.src = 'v044.js?v=044-smart-ops-20260830';",
                          indent+"    smart.async = false;",
                          indent+"    document.body.appendChild(smart);",
                          indent+"  }",
                          indent+"};"
                      ])
                      done=True
              if not done:
                  raise SystemExit('polish.async loader line not found')
              s='\n'.join(out)+'\n'
          p.write_text(s,encoding='utf-8')
          assert s.count('facilityOpsSmartOps044') >= 2
          assert "v044.js?v=044-smart-ops-20260830" in s
          PY
          node --check config.js
          node --check v044.js
          node --check v043_polish.js
          node --check v043_dashboard.js
      - name: Commit activation
        run: |
          git config user.name 'facility-ops-ui-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add config.js v044.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Activate FACILITY OPS v0.4.4 SMART OPS'
          git push
